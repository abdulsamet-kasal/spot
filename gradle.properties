# Project-wide Gradle settings.

# Increase JVM memory for the Gradle daemon and builds.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Parallel builds and configuration-on-demand for speed.
org.gradle.parallel=true
org.gradle.configureondemand=true

# Use AndroidX (enabled by default in AGP 8, kept explicit for clarity).
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official
